<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Score Prediction</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111827; background: #f9fafb; }
      header { background: #111827; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
      header h1 { font-size: 18px; margin: 0; }
      nav button { background: none; border: none; color: #9ca3af; font-size: 14px; padding: 6px 10px; cursor: pointer; border-radius: 6px; }
      nav button.active { color: #fff; background: #374151; }
      main { max-width: 1200px; margin: 0 auto; padding: 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 16px; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
      .card h3 { margin: 0 0 8px; font-size: 15px; }
      .card .hint { color: #6b7280; font-size: 12px; margin: 0 0 8px; }
      .stat .value { font-size: 26px; font-weight: 600; }
      .stat .label { color: #6b7280; font-size: 13px; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f3f4f6; }
      th { color: #6b7280; font-weight: 500; }
      .row { display: flex; gap: 16px; align-items: flex-start; }
      .list { width: 220px; max-height: 640px; overflow: auto; }
      .list button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .list button.active { background: #e0e7ff; }
      label { display: block; font-size: 13px; margin-bottom: 8px; }
      input { padding: 4px 6px; width: 90px; margin-left: 6px; }
      .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .error { color: #dc2626; font-size: 13px; }
      .ok { color: #16a34a; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script src="/charts.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
